name: adbrix_plugin
description: "This is official Flutter plugin for Adbrix 2.0 SDK."

version: 2.0.0
homepage: "https://adbrix.gitbook.io/developer-guide/platform/flutter"

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  plugin:
    platforms:
      android:
        package: com.igaworks.adbrix.flutter
        pluginClass: AdbrixPlugin
      ios:
        pluginClass: AdbrixPlugin
